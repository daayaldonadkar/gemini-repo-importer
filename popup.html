<!DOCTYPE html>
<!--
  popup.html — Configuration UI for assigning a GitHub repo URL to each shortcut.

  WHY THIS FILE EXISTS:
  This is the clickable surface where you map shortcut numbers (1..9) to
  repository URLs. The mappings are saved to chrome.storage.sync (via popup.js)
  and later read by background.js when a shortcut is pressed.

  The rows are generated by popup.js into the empty #fields container below,
  so the markup stays short and there's no duplicated HTML.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Layout: a compact form. system font so it matches the host OS. */
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 340px;
        margin: 0;
        padding: 16px;
        color: #202124;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      .hint {
        font-size: 11px;
        color: #5f6368;
        margin: 0 0 12px;
        line-height: 1.4;
      }

      /* Each shortcut row: fixed-width label + flexible URL input. */
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row label {
        width: 80px;
        font-size: 12px;
        flex-shrink: 0;
      }
      .row input {
        flex: 1;
        font-size: 12px;
        padding: 6px 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        outline: none;
        min-width: 0; /* allow flex item to shrink */
      }
      .row input:focus {
        border-color: #1a73e8;
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
      }

      /* Error / status messaging. */
      .error {
        font-size: 11px;
        color: #c5221f;
        margin: 4px 0 8px;
        line-height: 1.4;
      }
      .status {
        font-size: 11px;
        color: #137333;
        margin-top: 8px;
      }

      /* Save button. The disabled style is toggled by validation in popup.js. */
      #save {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #1a73e8;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #save:hover:not(:disabled) {
        background: #1765cc;
      }
      #save:disabled {
        background: #bdc1c6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Repository Shortcuts</h1>
    <p class="hint">
      Assign a GitHub URL to each shortcut (must start with
      <code>https://github.com/</code>). Shortcuts 1–3 are wired to
      Alt+Shift+1/2/3 today. Clear a field and Save to delete a mapping.
    </p>

    <!-- popup.js injects 9 "Shortcut N: [input]" rows here. -->
    <div id="fields"></div>

    <!-- Validation messages appear here; hidden until there's an error. -->
    <div id="error" class="error" hidden></div>

    <!-- Disabled while any field is invalid (see popup.js validate()). -->
    <button id="save">Save All</button>

    <!-- "Saved" confirmation, shown briefly after writing to storage. -->
    <div id="status" class="status" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
